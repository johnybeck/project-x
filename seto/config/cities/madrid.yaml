# Мадрид — город условия «полные данные» (пропозал v2, п. 3.1).
# Пока единственный город эксперимента; данные проверены в docs/MADRID_DATA.md.

name: madrid
title: "Мадрид"
role: dev                    # dev | test | reserve

boundary:
  source: osm_relation
  relation_id: 5326784       # муниципалитет Мадрид, ine:municipio 28079; 603,9 км² (проверено 28.10.2026)
  admin_level: 8

# Сетка в ETRS89 / UTM 30N, а не в WGS84 / UTM 30N (32630).
# В этой проекции лежат и реестр центров здоровья, и снимки WMS PNOA: при
# совпадении клетка остаётся осевым квадратом в системе снимка, и GetMap
# отдаёт ровно её, без поворота и перепроецирования (как Люцерн с 2056).
utm_epsg: 25830

sources:
  # Региональная выгрузка Geofabrik (Комунидад де Мадрид, ~85 МБ): муниципалитет
  # помещается целиком.
  osm_pbf:
    url: "https://download.geofabrik.de/europe/spain/madrid-latest.osm.pbf"
    license: "ODbL 1.0, OpenStreetMap contributors"
  # Тайл GHS-POP. Номер — по Mollweide: тайлы 1000 км, отсчёт от
  # x = −18 041 000, y = 9 000 000, нумерация с 1. Формула воспроизводит
  # тайлы Москвы (R3_C21) и Люцерна (R4_C19); все четыре угла рамки Мадрида
  # попадают в R5_C18, до края тайла не меньше 139 км.
  # Эпоха E2025 — как у Москвы и Люцерна; срез данных 01.01.2024 ближе к 2025.
  population_raster:
    url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R5_C18.zip"
    license: "CC BY 4.0, European Commission JRC (GHSL)"
  # Табличные источники пропозала v2 (п. 3.8). Проверены в docs/MADRID_DATA.md.
  # file — имя в raw/<город>/<срез>/; хеши пишутся в data_manifest.json.
  tables:
    # Реестр центров здоровья. Истории у файла нет: каталог обновляет его на
    # месте, поэтому версия — это только хеш в манифесте на дату загрузки.
    clinics_registry:
      url: "https://datos.comunidad.madrid/dataset/d8a0a444-adf5-4c04-8999-0eac3de52cb7/resource/2948b4da-8b39-42b7-b667-779a5284f39d/download/centros_servicios_establecimientos_sanitarios.csv"
      file: "clinics_registry.csv"
      license: "CC BY 4.0, Comunidad de Madrid"
      note: "Centros, servicios y establecimientos sanitarios; координаты ETRS89 / UTM 30N"
    # Население по участкам и возрасту по одному году на 01.01.2024 — срез,
    # совпадающий с границами Secciones_2024 (2450 из 2450).
    padron:
      url: "https://datos.madrid.es/dataset/209163-0-padron-municipal-historico/resource/209163-202-padron-municipal-historico-csv/download/209163-202-padron-municipal-historico-csv.csv"
      file: "padron_2024_01.csv"
      license: "CC BY 4.0, Ayuntamiento de Madrid"
      note: "Padrón municipal. Histórico. 2024. Enero"
    # Границы участков Мадрида. API отдаёт постранично; limit с запасом, а
    # полноту проверяет загрузчик (numberMatched = numberReturned).
    sections:
      url: "https://www.ine.es/geoserver/ogc/features/v1/collections/WMS_INE_SECCIONES_G01:Secciones_2024/items?f=json&limit=5000&filter=CUMUN%3D%2728079%27&filter-lang=cql-text"
      file: "sections_2024.geojson"
      license: "CC BY 4.0, INE"
      note: "Secciones_2024, муниципалитет 28079, EPSG:4326"
    # Доход по участкам (эталон М4 и частного сценария), вся провинция, все годы.
    income:
      url: "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31097.csv"
      file: "adrh_31097_income.csv"
      license: "INE, открытые данные"
      note: "ADRH, табл. 31097 «Indicadores de renta media y mediana»"

# Базовая сеть из реестра (пропозал v2, п. 3.2: центры здоровья — взрослая
# первичная помощь государственной сети). Правила — здесь, чтобы их можно было
# оспорить и пересчитать; разбор полей — docs/MADRID_DATA.md, п. 2.
# В расчёт подключается в задаче 2.3; до тех пор prepare-city берёт сеть из OSM.
registry:
  table: clinics_registry          # имя из sources.tables
  sep: ";"
  encoding: "utf-8"
  id_column: centro_nro_registro   # одна строка файла — учреждение × услуга
  x_column: localizacion_coordenada_x
  y_column: localizacion_coordenada_y
  crs: 25830                       # ETRS89 / UTM 30N — проверено геокодированием
  # Кто вообще кандидат: учреждения муниципалитета Мадрид.
  scope:
    column: municipio_nombre
    values: ["Madrid"]
  # Правила по порядку: учреждение исключается первым правилом, которому
  # не соответствует, и это правило пишется в отчёт.
  require:
    "не первичная помощь":
      column: centro_tipo
      values: ["Centro de salud", "Consultorio de atención primaria"]
    "не государственная сеть региона":
      column: dependecia_funcional
      values: ["Servicios o Institutos de Salud de las CC.AA"]
  # Центры сети без координат в реестре. Каждый найден в OSM как центр
  # здоровья на той же улице (и с тем же номером дома, где он есть);
  # координаты — центроид объекта OSM в EPSG:25830, выгрузка 28.10.2026.
  # Подставляются ТОЛЬКО центрам без координат: точка для центра с
  # координатами или для центра вне сети — ошибка, а не тихая замена.
  manual_points:
    CS1135:
      x: 443761
      y: 4481499
      source: "OSM w339068441 «Centro de Salud Jazmín», calle del Jazmín 33"
    CS1184:
      x: 440525
      y: 4468565
      source: "OSM w318323407 «Centro de Salud Orcasur», calle Arenas del Rey 1 (в реестре s/n)"
    CS19950:
      x: 443345
      y: 4476709
      source: "OSM w1255670012 «Centro de Salud Baviera», calle Pintor Moreno Carbonero 21"
    CS6158:
      x: 433667
      y: 4471784
      source: "OSM w391435113 «Centro de Salud Campamento», calle Mirueña 5 (в реестре s/n)"

# Жители по участкам и возрасту (пропозал v2, п. 3.3; MADRID_DATA п. 3).
# Одна строка падрона — участок × возраст по одному году; жители разбиты на
# четыре колонки (испанцы и иностранцы, мужчины и женщины).
demography:
  table: padron                    # имя из sources.tables
  sep: ";"
  encoding: "utf-8-sig"            # в файле BOM
  # Код участка INE (CUSEC) = муниципалитет + район (2 знака) + участок (3).
  code_prefix: "28079"
  district_column: COD_DISTRITO
  district_digits: 2
  section_column: COD_SECCION
  section_digits: 3
  age_column: COD_EDAD_INT         # «  54», последний класс — «100 o +»
  count_columns: [ESPANOLESHOMBRES, ESPANOLESMUJERES,
                  EXTRANJEROSHOMBRES, EXTRANJEROSMUJERES]
  # Группы — [от, до] включительно, null — без верхней границы.
  # 80+ вложена в 65+: она нужна только для проверки устойчивости (п. 3.3).
  groups:
    under_18: [0, 17]
    adults_18_64: [18, 64]
    seniors_65: [65, null]
    seniors_80: [80, null]
  # Эти группы обязаны давать всё население участка без остатка.
  partition: [under_18, adults_18_64, seniors_65]
  # Границы участков: в выдаче INE есть и контуры районов — их не берём.
  sections:
    table: sections
    code_column: CUSEC
    exclude: {TIPO: DISTRITO}

# Население клеток: сколько людей в участке — из падрона, как они лежат внутри
# участка — по GHS-POP. Сырой растр ошибается по районам Мадрида (юг занижен,
# север завышен, ~14 тыс. «жителей» в аэропорту) — MADRID_DATA п. 6.
# Отступление от п. 3.2 пропозала, записывается в протокол.
# Остальные параметры населения (mass_tolerance) — из global.yaml.
population:
  method: registry_by_raster

# Сеть берётся из реестра (раздел registry выше), а не из OSM по названию:
# русские правила глобального конфига здесь не нужны и не применяются.
base_network:
  source: registry

# feasible_site не переопределяется: застроенность считается, как в Москве,
# по зданиям с типом. Замер по выгрузке 2026-10-28 в границе города: тип
# (жилой или общественный) у 73 440 зданий из 128 848 — 57 % по числу, 55 %
# по площади; building=yes — 39 %. В Москве 56 %, в Люцерне 26 % — там и
# понадобилось built_share.

raw:
  osm_pbf: null
  population_raster: null

clinics_csv: null
adult_share_csv: null
