# Мадрид — город условия «полные данные» (пропозал v2, п. 3.1).
# Пока единственный город эксперимента; данные проверены в docs/MADRID_DATA.md.

name: madrid
title: "Мадрид"
role: dev                    # dev | test | reserve

boundary:
  source: osm_relation
  relation_id: 5326784       # муниципалитет Мадрид, ine:municipio 28079; 603,9 км² (проверено 28.10.2026)
  admin_level: 8

# Сетка в ETRS89 / UTM 30N, а не в WGS84 / UTM 30N (32630).
# В этой проекции лежат и реестр центров здоровья, и снимки WMS PNOA: при
# совпадении клетка остаётся осевым квадратом в системе снимка, и GetMap
# отдаёт ровно её, без поворота и перепроецирования (как Люцерн с 2056).
utm_epsg: 25830

sources:
  # Региональная выгрузка Geofabrik (Комунидад де Мадрид, ~85 МБ): муниципалитет
  # помещается целиком.
  osm_pbf:
    url: "https://download.geofabrik.de/europe/spain/madrid-latest.osm.pbf"
    license: "ODbL 1.0, OpenStreetMap contributors"
  # Тайл GHS-POP. Номер — по Mollweide: тайлы 1000 км, отсчёт от
  # x = −18 041 000, y = 9 000 000, нумерация с 1. Формула воспроизводит
  # тайлы Москвы (R3_C21) и Люцерна (R4_C19); все четыре угла рамки Мадрида
  # попадают в R5_C18, до края тайла не меньше 139 км.
  # Эпоха E2025 — как у Москвы и Люцерна; срез данных 01.01.2024 ближе к 2025.
  population_raster:
    url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R5_C18.zip"
    license: "CC BY 4.0, European Commission JRC (GHSL)"

# ВРЕМЕННО, до задачи 2.3 (сеть из реестра, docs/TODO_V2.md): правила
# глобального конфига написаны под русские названия и в Мадриде не найдут
# ничего. Пока сеть — все медобъекты OSM по тегам, как в Люцерне; этого
# хватает, чтобы проверить сетку, население и граф (задача 1.3), но не для
# расчёта вариантов.
base_network:
  include: ""
  typical: ""
  exclude: {}

# feasible_site не переопределяется: застроенность считается, как в Москве,
# по зданиям с типом. Замер по выгрузке 2026-10-28 в границе города: тип
# (жилой или общественный) у 73 440 зданий из 128 848 — 57 % по числу, 55 %
# по площади; building=yes — 39 %. В Москве 56 %, в Люцерне 26 % — там и
# понадобилось built_share.

raw:
  osm_pbf: null
  population_raster: null

clinics_csv: null
adult_share_csv: null
