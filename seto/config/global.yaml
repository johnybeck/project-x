# ============================================================
# SETO — параметры, общие для всех городов.
# Источник значений — пропозал v4 (п. 3.1, 3.2) и SETO_experiment_TODO_1.md (п. 3.1).
# Числа и пороги живут здесь, а не в коде. Исключение — списки тегов OSM
# (типы зданий, слои-препятствия): они пока зашиты в data/, см. раздел osm.
# ============================================================

# --- Сценарий ---
scenario: state              # state | private (частный — отдельно, п. 17)

# --- Размещение ---
k: 2                         # сколько новых объектов на город
k_sensitivity: [1]           # проверка устойчивости

# --- Доступность ---
T_minutes: 15                # главный порог (п. 3.1)
T_sensitivity: [10, 20]
walk_speed_m_per_min: 75     # ≈ 4,5 км/ч; время ребра = длина / скорость  [Д6]
t_max_minutes: 60            # потолок для недостижимых и дальних
snap_max_m: 300              # дальше этого точка считается непривязанной

# --- Базовая сеть: государственные ВЗРОСЛЫЕ поликлиники ПМСП (п. 3.1) ---
# По тегам OSM гос и частные не разделить: operator заполнен у 6,1 % объектов,
# operator:type — у двух из 1181. Поэтому отбор по названию; это ПРОКСИ, и его
# ограничение идёт в протокол. Настоящее выделение требует реестра (Л7).
#
# Порядок правил важен: срабатывает первое подошедшее, оно же пишется в отчёт.
# Правила живут здесь, а не в коде, чтобы их можно было оспорить и пересчитать.
base_network:
  include: "поликлин"        # что вообще считается поликлиникой
  # типовое название московской взрослой ПМСП; всё непохожее уходит человеку
  # на проверку, даже если ни одно правило исключения не сработало
  typical: "поликлиник\\w*\\s*№?\\s*\\d"
  exclude:
    детская: "детск|педиатр"
    стоматологическая: "стоматолог|зубн"
    женская консультация: "женск[аои]|родильн|перинатал|консультация женщин"
    ведомственная: "мвд|фсб|фсин|фтс|ржд|миноборон|министерств|войсковой|военно|военн[ыао]|флот|мид\\b|фмба|управлени[ея] делами|таможен|газпром|росатом|ведомств|центросоюз|фнпр|при университете|при .* университете"
    частная: "ооо|зао|оао|\\.ру\\b|частн|медси|инвитро|см-клиник|семейн|европейск|будь здоров"
    психоневрологическая: "психиатр|наркол|психоневр|психотерап"
    кожно-венерологическая: "кожно|дерматовенер"
    узкопрофильная: "онколог|туберкул|противотуберк|кардиолог|офтальмолог|эндокринолог|инфекционн|фтизиатр"
    не первичная помощь: "консультативно|диагностическ|реабилитац|восстановительн|санатор|хоспис"
# Женские консультации исключены: формально это взрослая амбулаторная помощь,
# но профиль узкий и терапевта там не принимают. Решение обсуждаемое — чтобы
# включить обратно, достаточно убрать строку.

# --- Общие ограничения (одинаковы для ВСЕХ вариантов A, B, M, C, D, E) ---
min_dist_to_existing_m: 500  # от новой площадки до любой существующей поликлиники
min_dist_between_new_m: 500  # между новыми площадками
# оба расстояния меряются ПО ПЕШЕХОДНОЙ СЕТИ, не по прямой

# --- Сетка ---
# Решение Д5 (08.10): UTM, origin округляется до кратного grid_size_m.
# Привязка к проекции, а не к границе города: иначе правка границы сдвигает все
# cell_id, а на них завязан кэш ответов VLM и имена файлов со снимками.
grid:
  size_m: 500                # как в MVP (пропозал п. 3.1 фиксирует только размер)
  origin_rule: "floor_to_size"   # origin = floor(min / size) * size в координатах UTM
  id_format: "cell_{:06d}"   # формат MVP
  # нумерация построчно снизу вверх, слева направо — тоже как в MVP

# --- Скоринг VLM ---
vlm:
  model: "google/gemma-4-31B-it"      # решение Д1 (08.10)
  base_url_env: "MODELS_BASE_URL"     # адрес берётся из .env, не из конфига
  api_key_env: "MODELS_API_KEY"       # ключ НИКОГДА не пишется в конфиг
  temperature: 0
  seed: 42
  max_tokens: 300
  timeout_s: 180
  max_parallel: 8
  requests_per_minute: 0              # 0 = без искусственного ограничения
  retries: 1                          # один повтор, потом imputed (п. 7.1)
  # Запасной выход для машин с VPN «на весь трафик»: такой клиент забирает
  # маршрут до внутреннего адреса себе, и сервер лаборатории недоступен.
  # Правильное решение — split-tunnel; это обход на случай, когда его нет.
  # Переопределяется переменной SETO_BIND_SOURCE_IP в .env.
  bind_source_ip: null

alpha: 1.0                   # вес скора: w_i = P_i * (1 + alpha * s_hat_i)
alpha_sensitivity: [0.5, 2.0]         # во всех городах: проверка устойчивости, не выбор (п. 3.4)

imputation_max_share: 0.05   # выше — вариант в городе неуспешен (п. 7.1)  [Д8]

# Перевод подоценок в скор (п. 3.5 пропозала): правило своё для каждого
# определения нуждаемости, одно на все города; задано заранее и не подбирается.
score_rule: age
score_rules:
  age:                       # N_возр: старшие эпохи заселены давно, там больше пожилых
    rating: epoch
    points:
      "до 1955": 3
      "1955-1975": 2
      "1975-2000": 1
      "после 2000": 0
      "не определить": 1.5   # середина шкалы: неизвестная эпоха не двигает клетку
  # Проверка, а не основное правило (решение 09.11, Д20, PROPOSAL_CHANGES п. 12).
  # По кадастру и реестру Мадрида доля 65+ почти одна до 2000 года и резко ниже
  # после: 21,5 / 21,4 / 20,5 / 8,6 %. Ступенька выведена из тех же данных, по
  # которым считается N, поэтому основной быть не может.
  age_step:
    rating: epoch
    points:
      "до 1955": 1
      "1955-1975": 1
      "1975-2000": 1
      "после 2000": 0
      "не определить": 0.5   # середина шкалы
# Правила-проверки: `step2 --scores <папка> --score-rule <имя>` пересчитывает скор из
# тех же ответов модели, без новых вызовов. Список закрыт и входит в протокол: другое
# правило после заморозки посчитать нельзя. Значение — пометка для протокола и отчёта.
score_rule_checks:
  age_step: "выбрана после просмотра эталонных данных Мадрида"

# --- Варианты ---
random_draws: 1000           # сколько случайных допустимых наборов для варианта A
seed: 0                      # сид для всего случайного

# P-median при k > 2 (пропозал v2, п. 3.4: М2 при k = 5 и 10) — эвристика
# обмена с нескольких случайных стартов; при k ≤ 2 остаётся полный перебор.
# Число стартов фиксируется ДО прогонов; разброс между ними пишется в отчёт.
swap_heuristic:
  starts: 20
  max_iterations: 1000

# М2 — ошибка замещения и доля захвата (пропозал v2, п. 3.10) и шаг 2 (п. 3.9):
# A, B, M, BN и потолок М2 при каждом k — без снимков и без модели.
m2:
  k_values: [1, 2, 5, 10]
  noise_draws: 200             # повторов B′ с зашумлённым населением
  noise_amplitude: 0.1         # P_i × U[0,9; 1,1]
  noise_percentile: 95         # порог шума — 95-й процентиль |Z_N(B) − Z_N(B′)|
  # Сравнение с перестановкой (решение 10.11, Д19, PROPOSAL_CHANGES п. 16): ответы
  # модели перемешиваются между клетками с жителями, решатель и вес спроса те же. Порог
  # шума не ловит случайный захват: скор меняет вес до двух раз, шум населения — на 10 %.
  permutation_draws: 200       # перестановок на вариант и k, как повторов у порога шума
  permutation_level: 0.05      # захват «выше случайного», если не больше этой доли
                               # перестановок дают захват не ниже, чем у варианта

# Правила вывода (пропозал v2, п. 3.10): что из какого исхода следует — до прогонов.
# source: proposal — строка пропозала как есть; added — дописана нами, с датой и причиной.
inference_rules:
  - if: "Потолок (М2) ниже порога шума при k = 2, но растёт с k"
    then: "при малом расширении плотной сети знание нуждаемости решение не меняет; польза снимка возможна только при большем k"
    source: proposal
  - if: "Потолок выше порога, захват D ≈ захват C"
    then: "изображение не добавляет к тексту; визуальный компонент можно убрать"
    source: proposal
  - if: "Захват D > C только на высоком разрешении"
    then: "польза изображения требует высокого разрешения; на 10 м её нет (для Москвы это ожидается заранее)"
    source: proposal
  - if: "Выводы при N_возр и N_соц в Вашингтоне различаются"
    then: "определение нуждаемости должно следовать устройству здравоохранения"
    source: proposal
  - if: "D по М2 не лучше C, а затраты выше"
    then: "«VLM в этой постановке не окупается» — определённый результат; если D лучше, но дороже, — цена прироста на одного жителя"
    source: proposal
  - if: "Потолок (М2) выше порога шума только при k = 1 и с ростом k не растёт"
    then: "знание о нуждаемости почти не меняет решение — это результат о постановке; вклад изображения в адресность по М2 в таком городе не оценивается; захват при k = 1 сам по себе выводом не служит; D − C, D − B и D − D10 читаются по главной метрике, качество восприятия — по М4"
    source: added
    note: "дописана 12.11.2026 после прогонов разработки на Мадриде: потолок 15,01 / 4,29 / 0 / 1,88 при k = 1, 2, 5, 10, выше шума только k = 1 (PROPOSAL_CHANGES п. 18, Д21)"
  - if: "Доля перестановок ответов модели с захватом не ниже, чем у варианта, больше 5 %"
    then: "захват не отличим от случайного, какой бы ни была его величина"
    source: added
    note: "дописана 10.11.2026: порог шума не ловит случайный захват (PROPOSAL_CHANGES п. 16, Д19)"

# Блок «адресность» (пропозал v2, п. 3.10): что нужно метрикам нуждающихся.
targeting:
  ede_epsilon: -1.0                      # сила штрафа за неравенство в М3
  ede_epsilon_sensitivity: [-0.5, -2.0]  # проверка устойчивости
  walk_speed_seniors_m_per_min: 60       # пешеходы 65+, Highway Capacity Manual

# GIS-AHP, варианты E, EN, EP (пропозал v2, п. 3.6). Источник — Dutta et al. (2022),
# GeoJournal 87(6), PMC8540883. Веса не меняются ни в одном городе.
ahp:
  # критерии в порядке таблиц 5 и 6 статьи: расстояние до существующих учреждений,
  # трущоб, главных дорог, районов высокой плотности, бедных районов
  criteria: [network, slums, roads, dense, poverty]
  matrix:                        # таблица 5, верхний треугольник по строкам
    - [3, 3, 3, 2]
    - [2, 2, 2]
    - [3, 2]
    - [2]
  published_weights: [0.387907, 0.209253, 0.176037, 0.12067, 0.106133]   # таблица 6
  excluded: [slums, poverty]     # аналогов в открытых данных нет
  # Дальше — наши решения: порогов и правила выбора в статье нет.
  dense_share: 0.25              # плотные районы — верхняя четверть клеток с жителями
  classes: 4                     # квартили по допустимым клеткам
  stability:                     # проверка устойчивости E, Монте-Карло
    draws: 1000
    weight_spread: 0.2           # каждый вес × U[0,8; 1,2]
    schemes: [4, 5, "continuous"]
    weight_methods: ["published", "eigenvector", "submatrix"]
    tie_rules: ["population_T", "population_cell", "cell_order"]
    # Наши пороги, которых нет в статье (решение 08.11, PROPOSAL_CHANGES п. 10):
    # что такое «район высокой плотности» и «главная дорога». Основной E берёт
    # dense_share и osm.main_roads и не меняется; Монте-Карло в каждом повторе
    # берёт порог случайно вместе с остальными спорными выборами.
    dense_shares: [0.10, 0.25, 0.50]     # десятая часть, четверть, половина клеток
    main_roads:                          # иерархия дорог OSM: на ступень выше и ниже
      primary: ["motorway", "trunk", "primary"]
      secondary: ["motorway", "trunk", "primary", "secondary"]
      tertiary: ["motorway", "trunk", "primary", "secondary", "tertiary"]

# Критерии пилота (пропозал v2, п. 3.10). Что мерится у E, пропозал велит указать
# заранее: algorithm — наша реконструкция, manual_analyst — ручная работа аналитика в
# ГИС. Берём algorithm: ручного процесса в проекте нет, и мерить было бы нечего.
pilot:
  e_cost_measure: "algorithm"
  # Чего ждать от критерия при таком выборе — пишется до прогонов (решение 09.11,
  # Д18, PROPOSAL_CHANGES п. 11). Текст идёт в протокол и в отчёт города как есть.
  e_cost_expectation: >-
    сравниваются два автоматических конвейера; у E дополнительного времени человека
    на новый город почти нет, поэтому критерий ожидаемо не выполнится; утверждение о
    днях ручной работы аналитика GIS-AHP этим критерием не проверяется

# --- Допустимые площадки ---
# [Д7] решено 10.11: пороги остаются; из каких зданий складывается застройка,
# город может переопределить (Мадрид и Люцерн считают все здания).
# Клетка отсекается, если ЛЮБОЕ условие ниже не выполнено (sites/feasible.py).
# Доля застройки — только здания с типом из data/features.py (RESIDENTIAL,
# PUBLIC); здания с building=yes (на Москве 44 % зданий) в неё НЕ входят.
# Слои-препятствия собираются в data/osm_layers.py и data/features.py:
#   вода   — natural=water, waterway=riverbank
#   зелень — leisure=park|garden и landuse=grass|forest
#   промзона, ж/д, кладбище, военная — landuse=industrial|railway|cemetery|military
# Препятствие отсекает клетку, только если занимает не меньше max_*_share
# её площади; при меньшей доле клетка остаётся допустимой.
feasible_site:
  min_built_area_share: 0.05      # доля площади жилых и общественных зданий в клетке
  # Из чего складывается «застроенность». По умолчанию только здания с
  # указанным типом. Там, где тип в OSM почти не проставлен, это занижает
  # застройку в разы — город переопределяет набор на built_share.
  built_from: ["residential_share", "public_share"]
  max_water_share: 0.5
  max_green_share: 0.5
  max_industrial_share: 0.5
  max_railway_share: 0.5
  max_cemetery_share: 0.5
  max_military_share: 0.5

# --- Теги OSM ---
# Код читает отсюда только clinic_tags, main_roads и walk_network. Списки
# landuse, buildings и poi — справочные: фактические списки зашиты в
# data/osm_layers.py и data/features.py, и правка здесь ничего не изменит.
osm:
  clinic_tags:
    amenity: ["clinic", "doctors", "hospital"]
    healthcare: ["clinic", "centre", "doctor"]
  landuse: ["residential", "commercial", "retail", "industrial", "railway",
            "cemetery", "military", "farmland", "construction"]
  buildings: ["apartments", "house", "detached", "residential",
              "commercial", "office", "retail", "public", "civic", "industrial"]
  main_roads: ["motorway", "trunk", "primary", "secondary"]   # для варианта E
  # Пешеходная сеть. Магистрали исключены: по ним ходить нельзя, а если их
  # оставить, граф свяжет берега реки по автомобильному мосту без тротуара.
  walk_network:
    include: ["footway", "path", "pedestrian", "steps", "living_street",
              "residential", "service", "unclassified", "tertiary",
              "secondary", "primary", "track", "cycleway", "road"]
    exclude: ["motorway", "motorway_link", "trunk", "trunk_link",
              "construction", "proposed", "raceway", "bus_guideway"]
  poi:
    amenity: ["school", "kindergarten", "pharmacy"]
    shop: ["supermarket", "convenience"]
    public_transport: ["platform"]
    highway: ["bus_stop"]

# --- Население ---
population:
  # Справочно: код это поле не читает. Берётся единственный *.tif из
  # raw/<город>/<срез>/; на Москве это тайл GHS-POP E2025 R2023A (Д9).
  # acquire растр не скачивает — он кладётся вручную (docs/SETO_README.md).
  source: "ghs_pop"          # [Д9 — предложено, не подтверждено]
  resolution_m: 100
  mass_tolerance: 0.001      # расхождение суммы при переносе в клетки, доля

# --- Снимки (вариант D) ---
imagery:
  provider: null             # [Д/Л6] — не выбран, условия использования не прочитаны
  target_m_per_px: 1.0
  size_px: 512
  context_margin_m: 0        # в MVP снимков нет, запаса наследовать неоткуда
  format: "png"

# --- Цены для учёта затрат (п. 14) ---
costs:
  vlm_per_1k_prompt_tokens: 0.0       # внутренний сервер бесплатный  [Д3]
  vlm_per_1k_completion_tokens: 0.0
  imagery_per_1k_tiles: 0.0
  note: "API бесплатный: критерий затрат считается по человеко-времени"

# --- Протокол ---
protocol:
  # Рабочие документы вне git (решение 12.11, Д22). На них ссылаются комментарии конфига
  # и список отступлений; протокол запоминает их контрольные суммы на момент заморозки.
  # Пути — от корня репозитория. Нет файла — заморозка откажет.
  reference_docs:
    - "docs/MADRID_DATA.md"
    - "docs/PROPOSAL_CHANGES.md"
    - "docs/TODO_V2.md"
  # Чего в коде нет при том, что пропозал об этом говорит (решение 12.11,
  # PROPOSAL_CHANGES п. 20). Идёт в протокол в список «чего эксперимент не делает».
  not_implemented:
    - "частный сценарий (пропозал, п. 3.11, шаг 6): отложен до основного результата"
    - "карты для ручной проверки строятся вручную, вне прогона"

# --- Срез данных ---
snapshot_date: "2026-10-08"   # дата среза; меняется только новой загрузкой

# --- Пути ---
# data_root задаёт, где лежат сырые данные и прогоны. Это ГИГАБАЙТЫ: выгрузки PBF,
# растры населения, спутниковые тайлы. Их не стоит держать в папке, которую
# синхронизирует облако: лишний трафик, расход квоты и задержки на каждую запись.
#
# null = корень репозитория. Путь вне облака задаётся переменной SETO_DATA_ROOT
# в .env (он в .gitignore, поэтому у каждого свой) — она имеет приоритет.
paths:
  data_root: null
